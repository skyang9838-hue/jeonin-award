<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f7f4ee">
<title>전인상 고르기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 상장 글자 전용 명조 (상장 안에서만 쓴다) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap">
<style>
:root{
  --paper:#f7f4ee; --card:#fffefb; --ink:#1c1a15; --ink2:#4a463c; --ink3:#767061; --line:rgba(60,50,30,.16);
  --yellow:#f6c026; --amber:#7a5800;
  --red:#c2362b;                       /* 도장 인주 */
  --gold:#b8913a; --gold2:#d9bd7a;      /* 상장 테두리 */
  --c1:#b4463a; --c2:#2c6a96;           /* 인성 · 꿈끼재능 */
  --serif:"Nanum Myeongjo","Batang",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
[hidden]{display:none!important}
.screen{position:fixed;inset:0;display:none;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) clamp(16px,2.6vw,40px) max(16px,env(safe-area-inset-bottom))}
.screen.on{display:flex}

/* 위 띠 */
.top{display:flex;align-items:center;gap:14px;min-height:52px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:clamp(21px,1.9vw,30px);font-weight:800;letter-spacing:-.04em;line-height:1;display:flex;align-items:center;gap:.45em;white-space:nowrap}
.top h1 svg{width:1.05em;height:1.05em}
.cap{font-size:13px;font-weight:600;color:var(--ink3);letter-spacing:.14em;white-space:nowrap}
.sp{flex:1}
.pill{height:44px;padding:0 18px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-size:16px;font-weight:700;color:var(--ink2);white-space:nowrap}
.pill:active{transform:translateY(1px)}

/* ---------- 1. 번호 판 ---------- */
#home .body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:clamp(24px,4vw,64px);align-items:center}
.lead h2{margin:0 0 18px;font-size:clamp(34px,4.2vw,58px);font-weight:800;letter-spacing:-.045em;line-height:1.18;word-break:keep-all}
.lead h2 em{font-style:normal;background:linear-gradient(transparent 56%,var(--yellow) 56%,var(--yellow) 88%,transparent 88%);padding:0 .05em}
.lead p{margin:0;font-size:clamp(17px,1.6vw,22px);line-height:1.65;color:var(--ink2);font-weight:500;word-break:keep-all}
.prog{margin-top:30px}
.prog .lab{display:flex;justify-content:space-between;font-size:15px;font-weight:700;color:var(--ink3);margin-bottom:9px}
.prog .lab b{color:var(--ink);font-size:20px}
.bar{height:10px;border-radius:5px;background:rgba(70,58,35,.09);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ink);border-radius:5px;transition:width .5s cubic-bezier(.3,.7,.3,1)}

#nums{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(8px,1vw,12px);align-content:center}
.num{position:relative;aspect-ratio:1.18/1;border-radius:12px;background:var(--card);
  box-shadow:0 0 0 1px var(--line),0 2px 0 rgba(60,50,30,.08);
  font-size:clamp(26px,2.9vw,40px);font-weight:800;letter-spacing:-.03em;color:var(--ink);transition:transform .08s}
.num:active{transform:translateY(2px)}
.num .st{position:absolute;right:8%;bottom:9%;width:34%;aspect-ratio:1;border-radius:50%;border:2px solid var(--red);color:var(--red);
  display:none;place-items:center;font-family:var(--serif);font-weight:800;font-size:clamp(10px,1vw,14px);transform:rotate(-12deg);opacity:.9}
.num.done{color:var(--ink3);background:#f3efe5}
.num.done .st{display:grid}

#hold{position:fixed;right:0;bottom:0;width:130px;height:70px;display:flex;align-items:flex-end;justify-content:flex-end;
  padding:0 18px 14px 0;font-size:14px;font-weight:700;color:#c4bdac}
#hold .ring{width:20px;height:20px;margin-right:7px;opacity:0;transition:opacity .15s}
#hold.holding .ring{opacity:1}

/* ---------- 2. 고르기 ---------- */
.who{height:44px;padding:0 16px;border-radius:9px;background:var(--ink);color:#fffefb;display:flex;align-items:center;font-size:22px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.ask{font-size:clamp(18px,1.7vw,23px);font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#pick .body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(16px,2vw,28px);padding-top:16px}
#board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.4vw,20px);min-height:0}
.col{display:grid;grid-template-rows:auto repeat(7,minmax(0,1fr));gap:clamp(6px,.8vh,9px);min-height:0}
.colh{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--ink2);letter-spacing:.04em;padding:0 2px 2px}
.colh::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--cc)}
.aw{position:relative;text-align:left;border-radius:10px;background:var(--card);box-shadow:0 0 0 1px var(--line);
  padding:0 46px 0 16px;display:flex;flex-direction:column;justify-content:center;gap:3px;min-height:0;overflow:hidden;transition:box-shadow .15s,transform .08s}
.aw:active{transform:translateY(1px)}
.aw .nm{font-size:clamp(18px,1.75vw,24px);font-weight:800;letter-spacing:-.03em;line-height:1.15;width:fit-content}
.aw .ds{font-size:clamp(12.5px,1.05vw,15px);line-height:1.35;color:var(--ink3);word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.aw .ck{position:absolute;right:13px;top:50%;width:24px;height:24px;margin-top:-12px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;color:transparent}
.aw .ck svg{width:14px;height:14px}
.aw.sel{box-shadow:0 0 0 2px var(--ink),0 6px 16px rgba(60,50,30,.12)}
.aw.sel .nm{background:linear-gradient(transparent 55%,var(--yellow) 55%,var(--yellow) 90%,transparent 90%)}
.aw.sel .ck{background:var(--ink);box-shadow:none;color:#fffefb}

.side{display:flex;flex-direction:column;gap:12px;min-height:0;align-items:stretch}
.side .cert{height:calc(100% - 72px);min-height:0}
.go{height:60px;border-radius:12px;background:var(--yellow);color:var(--ink);font-size:clamp(19px,1.7vw,23px);font-weight:800;letter-spacing:-.02em;
  box-shadow:inset 0 0 0 1px rgba(140,100,0,.35),0 3px 0 rgba(140,100,0,.35);transition:opacity .2s}
.go:disabled{background:rgba(70,58,35,.08);color:var(--ink3);box-shadow:none}
.go:not(:disabled):active{transform:translateY(2px);box-shadow:inset 0 0 0 1px rgba(140,100,0,.35)}

/* ---------- 상장 ---------- */
.cert{aspect-ratio:1/1.414;position:relative;background:#fffdf6;border-radius:4px;container-type:size;
  box-shadow:0 1px 0 rgba(60,50,30,.1),0 14px 34px rgba(60,50,30,.16)}
.cert .frame{position:absolute;inset:4.2%;border:1.5cqw solid transparent;
  border-image:repeating-linear-gradient(45deg,var(--gold) 0 1.2cqw,var(--gold2) 1.2cqw 2.4cqw) 1;}
.cert .frame::before{content:"";position:absolute;inset:1.8cqw;border:.35cqw solid var(--gold)}
.cert .frame::after{content:"";position:absolute;inset:2.9cqw;border:.15cqw solid var(--gold2)}
.cert .in{position:absolute;inset:11% 11% 13%;display:flex;flex-direction:column;align-items:center;text-align:center;font-family:var(--serif);color:#211d16}
.cert .no{align-self:flex-start;font-size:3.3cqw;color:#6b6250}
.cert .ttl{margin-top:3cqh;font-size:12.5cqw;font-weight:800;letter-spacing:.5em;padding-left:.5em;line-height:1}
.cert .aw-n{margin-top:4cqh;font-size:7.6cqw;font-weight:800;letter-spacing:.12em;padding-left:.12em;min-height:1.2em;line-height:1.2;color:var(--ink)}
.cert .aw-n.empty{color:#cfc6b2;font-weight:700;letter-spacing:0}
.cert .cat{font-size:3.4cqw;color:#7a6f58;margin-top:1.2cqh;letter-spacing:.08em}
.cert .who-l{margin-top:3.5cqh;font-size:4.6cqw;font-weight:700;letter-spacing:.06em}
.cert .txt{margin-top:3cqh;font-size:4.3cqw;line-height:1.8;word-break:keep-all;text-align:center;text-wrap:balance;max-width:100%}
.cert .date{margin-top:auto;padding-top:2cqh;font-size:4.2cqw;letter-spacing:.08em}
.cert .from{margin-top:2cqh;font-size:5.4cqw;font-weight:800;letter-spacing:.12em;position:relative}
.seal{position:absolute;right:-11cqw;top:50%;width:17cqw;height:17cqw;margin-top:-8.5cqw;border:.9cqw solid var(--red);border-radius:50%;color:var(--red);
  display:grid;place-items:center;font-size:4.2cqw;font-weight:800;line-height:1.05;letter-spacing:.05em;transform:rotate(-14deg);opacity:0;mix-blend-mode:multiply}
.seal span{display:block}
.cert.stamped .seal{animation:stamp .42s cubic-bezier(.2,1.6,.4,1) .25s forwards}
@keyframes stamp{0%{opacity:0;transform:rotate(-14deg) scale(2.2)}60%{opacity:.95}100%{opacity:.88;transform:rotate(-14deg) scale(1)}}
.cert.swap .aw-n,.cert.swap .txt{animation:swap .28s ease-out}
@keyframes swap{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- 3. 공개 ---------- */
#reveal .body{flex:1;min-height:0;display:grid;grid-template-columns:auto minmax(0,360px);gap:clamp(24px,4vw,64px);align-items:center;justify-content:center;padding-top:14px}
#reveal .cert{height:min(100%,calc(100vh - 120px))}
.rside h2{margin:0 0 14px;font-size:clamp(28px,3vw,42px);font-weight:800;letter-spacing:-.04em;line-height:1.2;word-break:keep-all}
.rside h2 em{font-style:normal;background:linear-gradient(transparent 56%,var(--yellow) 56%,var(--yellow) 88%,transparent 88%)}
.rside p{margin:0 0 26px;font-size:clamp(16px,1.5vw,20px);line-height:1.6;color:var(--ink2);word-break:keep-all}
.rside .go{width:100%}
.rside .again{margin-top:10px;width:100%;height:44px;font-size:16px;font-weight:700;color:var(--ink3)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(var(--r))}}

/* ---------- 4. 선생님 ---------- */
#teacher{overflow:auto;-webkit-user-select:text;user-select:text}
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start;padding-top:16px}
@media (max-width:900px){.tgrid{grid-template-columns:1fr}}
.panel{background:var(--card);border-radius:12px;box-shadow:0 0 0 1px var(--line);padding:18px 20px}
.panel + .panel{margin-top:16px}
.panel h3{margin:0 0 12px;font-size:17px;font-weight:800;letter-spacing:-.02em;display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel h3 span{font-weight:600;color:var(--ink3);font-size:15px}
.big{font-size:44px;font-weight:800;letter-spacing:-.04em}
.big small{font-size:20px;color:var(--ink3);font-weight:600}
.miss{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.miss i{font-style:normal;font-weight:800;font-size:17px;padding:5px 11px;border-radius:7px;box-shadow:0 0 0 1px var(--line);background:var(--paper)}
.cnt{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cnt h4{grid-column:1/-1;margin:8px 0 2px;font-size:14px;font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:7px}
.cnt h4::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--cc)}
.pr{display:flex;align-items:center;padding:9px 12px;border-radius:8px;background:var(--paper);font-weight:700;font-size:17px}
.pr .ct{margin-left:auto;font-size:21px;font-weight:800}
.pr.zero{color:var(--ink3);font-weight:500}
.pr.zero .ct{font-weight:500}
table{width:100%;border-collapse:collapse;font-size:17px}
td{padding:8px 4px;border-bottom:1px solid var(--line)}
td:first-child{width:60px;font-weight:800}
.tag{font-weight:800;background:linear-gradient(transparent 58%,var(--yellow) 58%,var(--yellow) 90%,transparent 90%)}
.dim{color:var(--ink3)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.row label{font-size:16px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:8px}
.row input{font:inherit;font-size:18px;font-weight:700;width:76px;height:44px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.row input.wide{width:140px}
.pill.warn{color:var(--red)}
.note{font-size:14px;color:var(--ink3);line-height:1.55;margin-top:12px}
.msg{font-size:14px;color:var(--amber);font-weight:700}

/* 세로 화면 */
@media (orientation:portrait){
  #home .body{grid-template-columns:1fr;align-content:center}
  #pick .body{display:flex;flex-direction:column;overflow:auto;gap:0}
  #board{display:block}
  .col{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
  .aw{flex:none;min-height:76px;padding-block:12px}
  .side{position:sticky;bottom:0;background:var(--paper);padding:10px 0 2px;box-shadow:0 -10px 14px var(--paper)}
  .side .cert{display:none}
  #reveal .body{grid-template-columns:1fr;justify-items:center}
  #reveal .cert{height:auto;width:min(86vw,480px)}
  .ask{display:none}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <symbol id="cap" viewBox="0 0 24 24"><path d="M12 3 1 8.5 12 14l9-4.5V16h2V8.5z" fill="currentColor"/><path d="M5.5 11.6v4.2C5.5 17.6 8.4 19 12 19s6.5-1.4 6.5-3.2v-4.2L12 15z" fill="currentColor" opacity=".55"/></symbol>
  <symbol id="check" viewBox="0 0 16 16"><path d="M3 8.5 6.5 12 13 4.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<!-- 1. 번호 판 -->
<section class="screen on" id="home">
  <div class="top">
    <h1><svg><use href="#cap"/></svg>전인상 고르기</h1>
    <span class="cap">2026 졸업 · 6학년 3반</span>
  </div>
  <div class="body">
    <div class="lead">
      <h2>6년 동안의 나에게<br><em>어울리는 상</em>은?</h2>
      <p>내 번호를 누르고 전인상 13개 중 하나를 골라요.<br>고른 상은 졸업식 상장에 들어가요.</p>
      <div class="prog">
        <div class="lab"><span>고른 친구</span><span><b id="doneN">0</b> / <span id="totN">23</span></span></div>
        <div class="bar"><i id="barI"></i></div>
      </div>
    </div>
    <div id="nums"></div>
  </div>
  <button id="hold" aria-label="선생님 화면 (1초 누르기)">
    <svg class="ring" viewBox="0 0 22 22"><circle cx="11" cy="11" r="9" fill="none" stroke="#ddd6c6" stroke-width="3"/>
      <circle id="ringFill" cx="11" cy="11" r="9" fill="none" stroke="#1c1a15" stroke-width="3" stroke-dasharray="56.5" stroke-dashoffset="56.5" transform="rotate(-90 11 11)"/></svg>
    선생님
  </button>
</section>

<!-- 2. 고르기 -->
<section class="screen" id="pick">
  <div class="top">
    <div class="who" id="who">7번</div>
    <div class="ask">나에게 어울리는 상을 하나 골라요</div>
    <div class="sp"></div>
    <button class="pill" id="back">취소</button>
  </div>
  <div class="body">
    <div id="board"></div>
    <div class="side">
      <div class="cert" id="pCert"></div>
      <button class="go" id="done" disabled>이 상으로 정하기</button>
    </div>
  </div>
</section>

<!-- 3. 공개 -->
<section class="screen" id="reveal">
  <div class="top">
    <h1><svg><use href="#cap"/></svg>전인상 고르기</h1>
    <span class="cap">2026 졸업 · 6학년 3반</span>
  </div>
  <div class="body">
    <div class="cert" id="rCert"></div>
    <div class="rside">
      <h2 id="rTitle"></h2>
      <p id="rNote"></p>
      <button class="go" id="next" disabled>다음 친구에게</button>
      <button class="again" id="redo">다시 고르기</button>
    </div>
  </div>
</section>

<!-- 4. 선생님 -->
<section class="screen" id="teacher">
  <div class="top">
    <h1><svg><use href="#cap"/></svg>선생님 화면</h1>
    <div class="sp"></div>
    <button class="pill" id="toKids">아이 화면으로</button>
  </div>
  <div class="tgrid">
    <div>
      <div class="panel">
        <h3>고른 친구</h3>
        <div class="big" id="tDone"></div>
        <div class="miss" id="tMiss"></div>
      </div>
      <div class="panel">
        <h3>상별 인원 <span id="tTotal"></span></h3>
        <div class="cnt" id="tCnt"></div>
        <div class="row"><button class="pill" id="copyCnt">상별 인원 복사</button><span class="msg" id="cntMsg"></span></div>
      </div>
    </div>
    <div>
      <div class="panel">
        <h3>번호별 상</h3>
        <table id="tTable"></table>
        <div class="row"><button class="pill" id="copyTbl">번호별 표 복사</button><span class="msg" id="tblMsg"></span></div>
      </div>
      <div class="panel">
        <h3>설정</h3>
        <div class="row" style="margin-top:0">
          <label>마지막 번호 <input type="number" id="setStu" min="1" max="40" inputmode="numeric"></label>
          <label>빠진 번호 <input class="wide" id="setSkip" placeholder="예: 7" inputmode="numeric"></label>
        </div>
        <div class="row">
          <button class="pill" id="saveSet">저장</button>
          <button class="pill warn" id="wipe">전부 지우기</button>
        </div>
        <div class="note">빠진 번호(전출 등)는 쉼표로 적어요. 친구가 번호를 다시 누르면 상을 고칠 수 있어요. 표는 이 태블릿에만 저장되고, 이름은 받지 않아요.</div>
      </div>
    </div>
  </div>
</section>

<div class="confetti" id="confetti"></div>

<script>
/* 전인상 13개: 「2026학년도 졸업사정회 회의 자료」 2쪽 표 그대로 (ds). why = 상장 문장용 */
const CATS = [
  { name:"인성 부문", c:"var(--c1)", items:[
    ["예절상","예절 바르고 인사를 잘하며 타의 모범이 되는 학생","예절 바르고 인사를 잘하며 다른 어린이의 모범이 되었으므로"],
    ["우정상","학우돕기 등에 앞장서서 급우들과 다정히 생활하는 학생","친구 돕기에 앞장서고 반 친구들과 다정하게 지냈으므로"],
    ["효행상","조부모님, 부모님을 잘 도와드리고 공경심이 바른 학생","조부모님과 부모님을 잘 도와드리고 공경하는 마음이 발랐으므로"],
    ["질서상","마음이 바르고 예절을 잘 지키며, 공중도덕을 잘 지켜 도덕심이 높은 학생","마음이 바르고 공중도덕을 잘 지켜 도덕심이 높았으므로"],
    ["성실상","생활 주변을 깨끗이 하고 안정된 정서로 학교생활을 하는 학생","생활 주변을 깨끗이 하고 차분한 마음으로 성실하게 생활하였으므로"],
    ["봉사상","봉사활동을 적극적으로 참여하는 학생","봉사활동에 적극적으로 참여하였으므로"],
    ["선행상","어려운 친구와 이웃을 돕는 학생","어려운 친구와 이웃을 따뜻하게 도왔으므로"] ] },
  { name:"꿈·끼·재능 부문", c:"var(--c2)", items:[
    ["정보기능상","컴퓨터 기능이 우수하고 인터넷 학습에 열심인 학생","컴퓨터 기능이 뛰어나고 정보 학습에 열심이었으므로"],
    ["운동기능상","운동 기능이 우수한 학생","운동 기능이 뛰어났으므로"],
    ["문예상","글짓기를 잘하는 학생","생각을 글로 잘 표현하였으므로"],
    ["창의상","발명 및 창의력이 우수한 학생","발명과 창의력이 뛰어났으므로"],
    ["그리기상","그리기 소질과 재능이 우수한 학생","그리기에 소질과 재능이 뛰어났으므로"],
    ["음악상","노래, 악기 연주를 잘하는 학생","노래와 악기 연주를 잘하였으므로"] ] },
];
const AW = {}; CATS.forEach(k => k.items.forEach(([n,d,w]) => AW[n] = { n, d, w, c:k.c, cat:k.name }));

const KEY = "jeonin-award-v1";
let mem = null;
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1) return s; }catch(e){}
  return mem || { v:1, last:24, skip:[7], picks:{} };   // picks[번호] = 상 이름
}
function save(){ mem = S; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
let S = load();

const $ = id => document.getElementById(id);
function show(id){ document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); }
const roster = () => { const a = []; for (let i = 1; i <= S.last; i++) if (!S.skip.includes(i)) a.push(i); return a; };
const done = n => !!S.picks[n];

/* 상장 그리기 */
function certHtml(n, award){
  const A = award ? AW[award] : null;
  return `<div class="frame"></div><div class="in">
    <div class="no">제 2027 - ${String(n).padStart(2,"0")} 호</div>
    <div class="ttl">상장</div>
    <div class="aw-n${A ? "" : " empty"}">${A ? A.n : "어떤 상일까?"}</div>
    <div class="cat">${A ? A.cat : "&nbsp;"}</div>
    <div class="who-l">6학년 3반 ${n}번</div>
    <div class="txt">${A ? `위 어린이는 6년 동안 ${A.w} 이 상장을 주어 칭찬합니다.` : "왼쪽에서 상을 고르면<br>여기에 상장이 만들어져요."}</div>
    <div class="date">2027년 2월</div>
    <div class="from">인천효성남초등학교장<div class="seal"><span>졸업</span><span>축하</span></div></div>
  </div>`;
}

/* ---------- 번호 판 ---------- */
function renderHome(){
  $("confetti").innerHTML = "";
  const list = roster();
  $("nums").innerHTML = "";
  list.forEach(i => {
    const b = document.createElement("button");
    b.className = "num" + (done(i) ? " done" : "");
    b.innerHTML = `${i}<span class="st">상</span>`;
    b.onclick = () => openPick(i);
    $("nums").appendChild(b);
  });
  const d = list.filter(done).length;
  $("doneN").textContent = d; $("totN").textContent = list.length;
  $("barI").style.width = (list.length ? d / list.length * 100 : 0) + "%";
  show("home");
}

/* ---------- 고르기 ---------- */
let who = null, sel = null;
function openPick(n){
  $("confetti").innerHTML = "";
  who = n; sel = S.picks[n] || null;
  $("who").textContent = `${n}번`;
  const board = $("board"); board.innerHTML = "";
  CATS.forEach(k => {
    const col = document.createElement("div"); col.className = "col"; col.style.setProperty("--cc", k.c);
    col.innerHTML = `<div class="colh">${k.name}</div>`;
    k.items.forEach(([nm, ds]) => {
      const b = document.createElement("button");
      b.className = "aw"; b.dataset.n = nm;
      b.innerHTML = `<span class="nm">${nm}</span><span class="ds">${ds}</span><span class="ck"><svg><use href="#check"/></svg></span>`;
      b.onclick = () => { sel = nm; paint(true); };
      col.appendChild(b);
    });
    board.appendChild(col);
  });
  paint(false); show("pick");
}
function paint(anim){
  document.querySelectorAll("#board .aw").forEach(b => b.classList.toggle("sel", b.dataset.n === sel));
  const c = $("pCert"); c.innerHTML = certHtml(who, sel);
  c.classList.remove("swap"); if (anim){ void c.offsetWidth; c.classList.add("swap"); }
  $("done").disabled = !sel;
}
$("back").onclick = renderHome;
$("done").onclick = () => {
  const edited = done(who) && S.picks[who] !== sel;
  const first = !done(who);
  S.picks[who] = sel; save();
  const c = $("rCert"); c.className = "cert"; c.innerHTML = certHtml(who, sel);
  $("rTitle").innerHTML = `${who}번은<br><em>${sel}</em>!`;
  $("rNote").textContent = edited ? "고른 상을 바꿨어요." : AW[sel].d.replace(/학생$/, "친구") + "에게 주는 상이에요.";
  show("reveal");
  requestAnimationFrame(() => c.classList.add("stamped"));
  $("next").disabled = true; setTimeout(() => $("next").disabled = false, 900);
  if (first) setTimeout(confetti, 450);
};
$("next").onclick = renderHome;
$("redo").onclick = () => openPick(who);

function confetti(){
  const box = $("confetti"); box.innerHTML = "";
  const cols = ["#f6c026","#1c1a15","#c2362b","#2c6a96","#d9bd7a","#fffefb"];
  for (let i = 0; i < 80; i++){
    const e = document.createElement("i");
    e.style.left = Math.random() * 100 + "vw";
    e.style.background = cols[i % cols.length];
    if (cols[i % cols.length] === "#fffefb") e.style.boxShadow = "0 0 0 1px rgba(60,50,30,.2)";
    e.style.setProperty("--r", (Math.random() * 900 - 450) + "deg");
    e.style.animationDuration = (1.8 + Math.random() * 1.6) + "s";
    e.style.animationDelay = (Math.random() * .35) + "s";
    box.appendChild(e);
  }
  setTimeout(() => box.innerHTML = "", 4000);
}

/* ---------- 선생님 화면: 오른쪽 아래 1초 누르기 ---------- */
let holdStart = 0, raf = null;
const hold = $("hold"), ring = $("ringFill");
function holdTick(){
  const t = Math.min(1, (performance.now() - holdStart) / 1000);
  ring.setAttribute("stroke-dashoffset", 56.5 * (1 - t));
  if (t >= 1){ endHold(); openTeacher(); return; }
  raf = requestAnimationFrame(holdTick);
}
function endHold(){ cancelAnimationFrame(raf); hold.classList.remove("holding"); ring.setAttribute("stroke-dashoffset", 56.5); }
hold.addEventListener("pointerdown", e => { e.preventDefault(); holdStart = performance.now(); hold.classList.add("holding"); raf = requestAnimationFrame(holdTick); });
["pointerup","pointerleave","pointercancel"].forEach(ev => hold.addEventListener(ev, endHold));
document.addEventListener("contextmenu", e => { if (!$("teacher").classList.contains("on")) e.preventDefault(); });

function counts(){
  const c = {}; Object.keys(AW).forEach(n => c[n] = 0);
  roster().forEach(i => { if (S.picks[i] && c[S.picks[i]] !== undefined) c[S.picks[i]]++; });
  return c;
}
function openTeacher(){
  const list = roster(), got = list.filter(done), miss = list.filter(i => !done(i));
  $("tDone").innerHTML = `${got.length}<small> / ${list.length}명</small>`;
  $("tMiss").innerHTML = miss.length ? miss.map(n => `<i>${n}</i>`).join("") : `<span class="dim">모두 골랐어요.</span>`;
  const c = counts();
  $("tTotal").textContent = `합계 ${got.length}명`;
  $("tCnt").innerHTML = CATS.map(k => {
    const sum = k.items.reduce((a,[n]) => a + c[n], 0);
    return `<h4 style="--cc:${k.c}">${k.name} · ${sum}명</h4>` + k.items.map(([n]) =>
      `<div class="pr${c[n] ? "" : " zero"}"><span>${n}</span><span class="ct">${c[n]}</span></div>`).join("");
  }).join("");
  $("tTable").innerHTML = list.map(i => `<tr><td>${i}번</td><td>${S.picks[i] ? `<span class="tag">${S.picks[i]}</span>` : `<span class="dim">아직</span>`}</td></tr>`).join("");
  $("setStu").value = S.last; $("setSkip").value = S.skip.join(", ");
  wipeArmed = false; $("wipe").textContent = "전부 지우기";
  $("cntMsg").textContent = ""; $("tblMsg").textContent = "";
  show("teacher");
}
async function copy(text, msgId){
  let ok = false;
  try{ await navigator.clipboard.writeText(text); ok = true; }catch(e){
    const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
    try{ ok = document.execCommand("copy"); }catch(_){} t.remove();
  }
  $(msgId).textContent = ok ? "복사했어요" : "복사가 안 돼요";
}
$("copyTbl").onclick = () => copy(roster().map(i => `${i}\t${S.picks[i] || ""}`).join("\n"), "tblMsg");
$("copyCnt").onclick = () => { const c = counts(); copy(Object.keys(AW).map(n => `${n}\t${c[n]}`).join("\n"), "cntMsg"); };
$("toKids").onclick = renderHome;
$("saveSet").onclick = () => {
  S.last = Math.max(1, Math.min(40, +$("setStu").value || S.last));
  S.skip = $("setSkip").value.split(/[^0-9]+/).map(Number).filter(n => n >= 1 && n <= S.last);
  save(); openTeacher();
};
let wipeArmed = false;
$("wipe").onclick = () => {
  if (!wipeArmed){ wipeArmed = true; $("wipe").textContent = "정말요? 한 번 더"; return; }
  S.picks = {}; save(); openTeacher();
};

renderHome();
</script>
</body>
</html>
